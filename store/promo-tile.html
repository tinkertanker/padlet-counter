<!doctype html>
<!-- Source for promo-tile-440x280.png. Render at 440×280 CSS pixels, device scale 1. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      background: #f3f4f6; color: #111827; display: grid; font-family: system-ui, sans-serif;
      grid-template-columns: 112px 1fr; align-items: center; gap: 28px; padding: 0 36px; box-sizing: border-box;
    }
    img { width: 112px; height: 112px; }
    h1 { font-size: 30px; line-height: 1.1; margin: 0 0 12px; }
    .bar { display: flex; box-shadow: inset 0 0 0 1px #d1d5db; color: #fff; border-radius: 999px; overflow: hidden; height: 26px; font: 700 13px/26px system-ui, sans-serif; text-align: center; }
    .bar span { flex: 1; }
    p { margin: 12px 0 0; opacity: .75; font-size: 14px; }
  </style>
</head>
<body>
  <img src="../icons/icon-128.png" alt="">
  <div>
    <h1>Section Counter for&nbsp;Padlet</h1>
    <div class="bar">
      <span style="background:#fff;color:#111827">4</span><span style="background:#c81e1e">3</span><span style="background:#facc15;color:#111827">5</span><span style="background:#15803d">2</span><span style="background:#1d4ed8">6</span><span style="background:#7e22ce">1</span>
    </div>
    <p>Live post counts for every section, by colour.</p>
  </div>
</body>
</html>
