<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Install Padlet Section Counter</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { display: grid; margin: 0; min-height: 100vh; place-items: center; }
    main { max-width: 640px; padding: 32px; text-align: center; }
    a { background: #e6007e; border-radius: 999px; color: white; display: inline-block; font-weight: 700; margin: 20px; padding: 14px 22px; text-decoration: none; }
    kbd { border: 1px solid #888; border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <h1>Padlet Section Counter</h1>
    <p>Drag this button to your bookmarks bar:</p>
    <p><a href="javascript:(() =&gt; { &quot;use strict&quot;; const INSTANCE_KEY = &quot;__padletSectionCounter&quot;; const BADGE_CLASS = &quot;padlet-section-counter-badge&quot;; const STYLE_ID = &quot;padlet-section-counter-styles&quot;; const SECTION_SELECTOR = [ &quot;section.surface-section&quot;, 'section[id^=&quot;section-&quot;]', '[data-testid=&quot;section&quot;]', '[data-testid=&quot;column&quot;]', '[data-testid=&quot;row&quot;]', '[data-testid=&quot;shelf&quot;]', '[data-testid=&quot;board-section&quot;]', '[data-testid=&quot;section-container&quot;]', '[data-testid=&quot;column-container&quot;]', &quot;[data-section-id]&quot;, &quot;[data-section-uid]&quot;, &quot;[data-column-id]&quot;, &quot;[data-column-uid]&quot; ].join(&quot;,&quot;); const POST_SELECTOR = [ '[data-testid=&quot;postWrapper&quot;]', '[data-testid=&quot;surfacePost&quot;]', '[data-testid=&quot;post&quot;]', '[data-testid=&quot;post-card&quot;]', '[data-testid=&quot;postCard&quot;]', '[data-testid=&quot;board-post&quot;]', &quot;[data-post-id]&quot;, &quot;[data-post-uid]&quot;, '[data-item-type=&quot;post&quot;]', &quot;article&quot; ].join(&quot;,&quot;); const HEADER_SELECTOR = [ '[data-testid=&quot;sectionTitle&quot;]', '[data-testid=&quot;sectionTitleText&quot;]', '[data-testid=&quot;section-header&quot;]', '[data-testid=&quot;column-header&quot;]', '[data-testid=&quot;row-header&quot;]', '[data-testid=&quot;section-title&quot;]', '[data-testid=&quot;column-title&quot;]', &quot;header&quot;, &quot;h1&quot;, &quot;h2&quot;, &quot;h3&quot;, '[role=&quot;heading&quot;]' ].join(&quot;,&quot;); function addStyles() { if (document.getElementById(STYLE_ID)) return; const style = document.createElement(&quot;style&quot;); style.id = STYLE_ID; style.textContent = ` .${BADGE_CLASS} { align-items: center !important; background: #111827 !important; border: 1px solid rgba(255, 255, 255, .2) !important; border-radius: 999px !important; box-shadow: 0 1px 2px rgba(0, 0, 0, .2) !important; box-sizing: border-box !important; color: #fff !important; display: inline-flex !important; flex: 0 0 auto !important; font: 700 12px/1 system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif !important; height: 22px !important; justify-content: center !important; margin-inline-start: 8px !important; min-width: 22px !important; padding: 0 7px !important; pointer-events: none !important; vertical-align: middle !important; white-space: nowrap !important; } @media (prefers-contrast: more) { .${BADGE_CLASS} { border: 2px solid #fff !important; } } `; (document.head || document.documentElement).append(style); } function allPosts(root = document) { return [...new Set(root.querySelectorAll(POST_SELECTOR))].filter( (post) =&gt; !post.parentElement?.closest(POST_SELECTOR) &amp;&amp; !post.closest(&quot;[role=dialog], [contenteditable=true]&quot;) ); } function externalHeader(container) { const sectionTitle = container.querySelector('[data-testid=&quot;sectionTitle&quot;]'); if (sectionTitle &amp;&amp; !sectionTitle.closest(POST_SELECTOR)) return sectionTitle; return [...container.querySelectorAll(HEADER_SELECTOR)].find( (header) =&gt; !header.closest(POST_SELECTOR) &amp;&amp; !header.closest(&quot;[role=dialog]&quot;) ); } function explicitSections() { const candidates = [...new Set(document.querySelectorAll(SECTION_SELECTOR))].filter( (section) =&gt; !section.closest(POST_SELECTOR) &amp;&amp; externalHeader(section) ); return candidates.filter( (section) =&gt; !candidates.some( (other) =&gt; other !== section &amp;&amp; section.contains(other) &amp;&amp; externalHeader(other) ) ); } function inferredSections(posts) { const sections = new Set(); for (const post of posts) { let parent = post.parentElement; let levels = 0; while (parent &amp;&amp; parent !== document.body &amp;&amp; levels &lt; 8) { if (externalHeader(parent)) { sections.add(parent); break; } parent = parent.parentElement; levels += 1; } } return sections.size &gt; 1 ? [...sections] : []; } function sectionPosts(section, inferred, posts, sections) { return posts.filter((post) =&gt; { if (!section.contains(post)) return false; if (inferred) { return !sections.some( (other) =&gt; other !== section &amp;&amp; section.contains(other) &amp;&amp; other.contains(post) ); } return !sections.some( (other) =&gt; other !== section &amp;&amp; section.contains(other) &amp;&amp; other.contains(post) ); }); } function putBadge(section, count) { const target = externalHeader(section); if (!target || target.closest(POST_SELECTOR)) return false; let badge = [...target.children].find((child) =&gt; child.classList?.contains(BADGE_CLASS)); if (!badge) { badge = document.createElement(&quot;span&quot;); badge.className = BADGE_CLASS; badge.setAttribute(&quot;aria-live&quot;, &quot;polite&quot;); target.append(badge); } const label = `${count} ${count === 1 ? &quot;entry&quot; : &quot;entries&quot;}`; if (badge.textContent !== String(count)) badge.textContent = String(count); badge.setAttribute(&quot;aria-label&quot;, label); badge.title = label; return true; } function createCounter() { let timer; let observer; function refresh() { clearTimeout(timer); addStyles(); const posts = allPosts(); let sections = explicitSections(); const inferred = sections.length === 0; if (inferred) sections = inferredSections(posts); const activeBadges = new Set(); for (const section of sections) { const count = sectionPosts(section, inferred, posts, sections).length; if (putBadge(section, count)) { const badge = section.querySelector(`.${BADGE_CLASS}`); if (badge) activeBadges.add(badge); } } document.querySelectorAll(`.${BADGE_CLASS}`).forEach((badge) =&gt; { if (!activeBadges.has(badge)) badge.remove(); }); } function queueRefresh() { clearTimeout(timer); timer = setTimeout(refresh, 120); } observer = new MutationObserver((mutations) =&gt; { if (mutations.every((mutation) =&gt; mutation.target.closest?.(`.${BADGE_CLASS}`))) return; queueRefresh(); }); observer.observe(document.documentElement, { childList: true, subtree: true }); refresh(); return { refresh, destroy() { clearTimeout(timer); observer.disconnect(); document.querySelectorAll(`.${BADGE_CLASS}`).forEach((badge) =&gt; badge.remove()); document.getElementById(STYLE_ID)?.remove(); delete window[INSTANCE_KEY]; } }; } window[INSTANCE_KEY]?.destroy?.(); window[INSTANCE_KEY] = createCounter(); })();">Count Padlet entries</a></p>
    <p>Then open a Padlet in rows or columns mode and click the bookmark.</p>
    <p>If your bookmarks bar is hidden, show it with <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>B</kbd> (Windows/Linux) or <kbd>⌘</kbd> + <kbd>Shift</kbd> + <kbd>B</kbd> (Mac).</p>
  </main>
</body>
</html>
